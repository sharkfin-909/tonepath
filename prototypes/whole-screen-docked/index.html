<!doctype html>
<!--
  PROTOTYPE — throwaway. Ticket "Whole-screen layout (docked hex)" (issues/030).
  Question: what does the whole screen look like on a real tune (32 bars, split bars) with in-slot notation on top
  and the docked hex below — where do the title, instrument, mute and length/Rest latches sit, how does the chart
  scroll or zoom, and what does a tablet-on-a-stand read mode look like?
  Three layouts, switched with ?variant=A|B|C or the floating bar ( [ / ] keys ):
    A · Scroll stack  — header on top, chart scrolls at a fixed zoom (−/+), entry toolbar sits between chart and dock.
    B · Focus rows    — the chart shows only the caret's row ± 1 (large), with an overview minimap of all 32 bars; latches
                        live in columns on the dock's left and right edges.
    C · Fit all + rail — every row of the form is squeezed into the top half (auto zoom, no scroll); all controls
                        sit in a left rail that runs the full height.
  Stand (read) mode: \ key or the "Stand" button — hides the hex and edit chrome; "fit page" vs "large + page turns".
  Frame: preview at laptop / tablet sizes (scaled to fit the window). ⓘ shows measured sizes (hex cell, staff gap, bars visible).
  Editing = overwrite model from "Melody entry and caret (docked)". Notation is a crude stand-in for VexFlow.
  Run: open prototypes/whole-screen-docked/index.html
-->
<html>
<head>
<meta charset="utf-8">
<title>PROTOTYPE — Whole-screen layout (docked hex)</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 13px system-ui, sans-serif; background: #6b6b6b; color: #222; overflow: hidden; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #app { background: #eceae4; position: relative; overflow: hidden; display: flex; flex-direction: column; transform-origin: center center; box-shadow: 0 0 0 1px #000, 0 10px 40px #0006; }
  body.fluid #app { box-shadow: none; }
  button, select, input { font: inherit; }
  .btn { font: 600 13px system-ui; min-width: 32px; height: 30px; border: 1px solid #aaa; background: #fff; border-radius: 4px; cursor: pointer; padding: 0 8px; white-space: nowrap; }
  .btn.on { background: #2a6fdb; color: #fff; border-color: #2a6fdb; }
  .btn.restOn { background: #333; color: #fff; }
  .btn.blink { animation: blink .35s; }
  @keyframes blink { 0% { background: #f5c542; } 100% {} }
  .btn.ghost { border-color: transparent; background: transparent; }
  .grp { display: inline-flex; gap: 2px; }
  .hdr { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #fff; border-bottom: 1px solid #ccc; flex: none; }
  .title { font: 700 16px system-ui; border: 1px solid transparent; background: transparent; padding: 2px 4px; border-radius: 3px; min-width: 0; }
  .title:hover, .title:focus { border-color: #bbb; }
  .muted { color: #777; font-size: 12px; }
  .spacer { flex: 1; }
  /* chart */
  .chartWrap { overflow: auto; min-height: 0; }
  .row { display: grid; background: #fff; border-left: 1px solid #bbb; margin-bottom: 0; }
  .row + .row { border-top: 0; }
  .slot { border-right: 1px dashed #bbb; border-bottom: 1px solid #999; position: relative; cursor: text; min-width: 0; }
  .slot.barEnd { border-right: 3px solid #333; }
  .slot.active { background: #eef4fd; }
  .slot .sh { display: flex; align-items: baseline; gap: 6px; padding: 0 6px; white-space: nowrap; overflow: hidden; }
  .slot select.chord { font-weight: 700; border: 0; background: transparent; padding: 0; cursor: pointer; appearance: none; }
  .slot .sc { color: #777; overflow: hidden; text-overflow: ellipsis; }
  .slot .bn { position: absolute; left: 3px; bottom: 1px; font-size: 9px; color: #aaa; }
  .slot svg { display: block; width: 100%; }
  .ev { cursor: pointer; }
  .ev:hover .head { stroke: #2a6fdb; stroke-width: 2; }
  /* dock */
  .dock { min-height: 0; background: #d9d6ce; position: relative; }
  .dock svg.hex { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cell { cursor: pointer; }
  .cell.inactive { cursor: not-allowed; }
  .cell text { pointer-events: none; font-weight: 600; }
  .cell .halo { fill: none; stroke: #2a6fdb; stroke-width: 4; opacity: 0; }
  .cell.dup .halo { opacity: .9; }
  .cell.prev .halo { opacity: .55; stroke-dasharray: 4 3; }
  .cell:hover .face { filter: brightness(.94); }
  .tools { display: flex; gap: 10px; align-items: center; padding: 5px 12px; background: #f6f5f1; border-top: 1px solid #bbb; border-bottom: 2px solid #999; flex: none; flex-wrap: wrap; }
  /* B */
  .bBody { display: flex; min-height: 0; }
  .mini { width: 170px; flex: none; background: #f6f5f1; border-right: 1px solid #ccc; padding: 6px; overflow: auto; }
  .mini .mrow { display: grid; gap: 2px; margin-bottom: 2px; padding: 1px; border-radius: 3px; }
  .mini .mrow.shown { background: #cfdcf3; }
  .mini .mb { background: #fff; border: 1px solid #ccc; font-size: 9.5px; padding: 2px 2px 5px; cursor: pointer; white-space: nowrap; overflow: hidden; position: relative; border-radius: 2px; }
  .mini .mb.cur { outline: 2px solid #2a6fdb; }
  .mini .mb .fillbar { position: absolute; left: 0; bottom: 0; height: 3px; background: #9fbbe6; }
  .dockCol { position: absolute; top: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
  .dockCol .btn { width: 64px; }
  /* C */
  .cWrap { display: flex; flex: 1; min-height: 0; }
  .rail { width: 128px; flex: none; background: #fff; border-right: 1px solid #ccc; display: flex; flex-direction: column; gap: 6px; padding: 8px; overflow: auto; }
  .rail .btn { width: 100%; }
  .rail .lab { font-size: 10.5px; color: #888; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
  .rail select { width: 100%; }
  .cMain { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  /* read */
  .readHdr { display: flex; align-items: center; gap: 10px; padding: 6px 14px; background: #fff; border-bottom: 1px solid #ccc; flex: none; }
  .pageBtns { position: absolute; right: 10px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
  .pageBtns .btn { width: 56px; height: 56px; font-size: 22px; opacity: .85; }
  /* switcher + metrics */
  #switch { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); background: #111; color: #fff; border-radius: 999px; padding: 5px 8px; display: flex; gap: 8px; align-items: center; box-shadow: 0 4px 18px #0008; z-index: 50; font-size: 12px; opacity: .92; }
  #switch button, #switch select { background: #333; color: #fff; border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  #switch button.on { background: #f5c542; color: #111; }
  #switch .lbl { min-width: 150px; text-align: center; font-weight: 700; }
  #switch .tag { background: #c0392b; padding: 1px 6px; border-radius: 3px; font-weight: 700; font-size: 10px; }
  #metrics { position: fixed; right: 10px; top: 10px; background: #1e1e1e; color: #d6d6d6; font: 11.5px/1.5 ui-monospace, monospace; padding: 8px 10px; border-radius: 6px; white-space: pre; z-index: 50; display: none; opacity: .93; }
  #toast { position: absolute; left: 50%; top: 48px; transform: translateX(-50%); background: #222; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12.5px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  #toast.show { opacity: .95; }
</style>
</head>
<body>
<div id="stage"><div id="app"></div></div>
<div id="switch">
  <span class="tag">PROTOTYPE</span>
  <button id="vPrev">◀</button><span class="lbl" id="vLbl"></span><button id="vNext">▶</button>
  <button id="readBtn" title="\">Stand</button>
  <select id="frame">
    <option value="fluid">frame: window</option>
    <option value="1440x900">laptop 1440×900</option>
    <option value="1280x800">laptop 1280×800</option>
    <option value="1024x768">tablet 1024×768</option>
    <option value="768x1024">tablet portrait 768×1024</option>
  </select>
  <select id="split"><option value="40">dock 40%</option><option value="50" selected>dock 50%</option><option value="60">dock 60%</option></select>
  <button id="infoBtn" title="i">ⓘ</button>
</div>
<pre id="metrics"></pre>
<script>
// ================= music basics (from earlier prototypes) =================
const LET = 'CDEFGAB', LPC = [0,2,4,5,7,9,11];
const mod = (x, n) => ((x % n) + n) % n;
const DEFSET = [['C',0],['C',1],['D',0],['E',-1],['E',0],['F',0],['F',1],['G',0],['A',-1],['A',0],['B',-1],['B',0]];
const accS = a => a > 0 ? '♯' : a < 0 ? '♭' : '';
const parsePitch = s => { const m = s.match(/^([A-G])(#|b)?(\d)$/); return 12 * (+m[3] + 1) + LPC[LET.indexOf(m[1])] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); };
function spellPc(L, pc) { const a = mod(pc - LPC[L] + 6, 12) - 6; if (Math.abs(a) > 1) { const [l, aa] = DEFSET[mod(pc, 12)]; return { L: LET.indexOf(l), a: aa }; } return { L, a }; }
const SCALES = {
  Dorian: [[0,0],[1,2],[2,3],[3,5],[4,7],[5,9],[6,10]], Mixolydian: [[0,0],[1,2],[2,4],[3,5],[4,7],[5,9],[6,10]],
  Ionian: [[0,0],[1,2],[2,4],[3,5],[4,7],[5,9],[6,11]], altered: [[0,0],[1,1],[2,3],[2,4],[4,6],[5,8],[6,10]],
  Locrian: [[0,0],[1,1],[2,3],[3,5],[4,6],[5,8],[6,10]],
};
const QUAL = { m7: ['Dorian', [0,3,7,10]], '7': ['Mixolydian', [0,4,7,10]], maj7: ['Ionian', [0,4,7,11]], '7alt': ['altered', [0,4,8,10,3]], m7b5: ['Locrian', [0,3,6,10]] };
const SYMS = ['Cmaj7','Fmaj7','Am7','Dm7','Em7','Gm7','Bm7b5','G7','A7','C7','D7','E7alt','G7alt'];
function slotDef(sym) { const m = sym.match(/^([A-G][b#]?)(.*)$/); const [scale, chord] = QUAL[m[2]]; return { root: m[1], q: m[2], scale, chord }; }
const INSTR = [
  ['Concert', null, null, [0,0]], ['Flute', 'C4', 'C7', [0,0]], ['Violin', 'G3', 'E7', [0,0]], ['Trombone', 'E2', 'Bb4', [0,0]],
  ['B♭ trumpet', 'F#3', 'C6', [1,2]], ['B♭ tenor sax', 'Bb3', 'F#6', [8,14]], ['E♭ alto sax', 'Bb3', 'F#6', [5,9]],
  ['Guitar', 'E3', 'E6', [7,12]], ['Double bass / bass guitar', 'E2', 'G4', [7,12]],
];
const DEG = ['#e41a1c','#ff7f00','#ffd92f','#4daf4a','#377eb8','#984ea3','#a65628'];
function buildSlot(s, iv) {
  const rL = LET.indexOf(s.root[0]), rA = s.root.length > 1 ? (s.root[1] === '#' ? 1 : -1) : 0;
  const wr = spellPc(mod(rL + iv[0], 7), LPC[rL] + rA + iv[1]), rPc = mod(LPC[wr.L] + wr.a, 12);
  const degs = SCALES[s.scale].map(([st, se]) => ({ semis: se, step: st, ...spellPc(mod(wr.L + st, 7), rPc + se) }));
  const wRoot = LET[wr.L] + accS(wr.a);
  return { ...s, rPc, degs, N: degs.length, pcs: new Set(degs.map(d => mod(rPc + d.semis, 12))), chordPcs: new Set(s.chord.map(x => mod(rPc + x, 12))),
    sym: wRoot + s.q.replace('b5', '♭5'), scName: wRoot + ' ' + s.scale };
}
function cellPitch(sc, t) { const d = mod(t, sc.N), o = Math.floor(t / sc.N), g = sc.degs[d]; const midi = 12 + sc.rPc + g.semis + 12 * o; return { t, deg: g.step, midi, L: g.L, a: g.a, chord: sc.chordPcs.has(mod(midi, 12)) }; }
const rowOff = r => { let o = 0; for (let i = 0; i < r; i++) o += (i % 2 === 0) ? 3 : 2; return o; };
function spellWritten(w, sc) {
  const pc = mod(w, 12), d = sc.degs.find(g => mod(LPC[g.L] + g.a, 12) === pc);
  let L, a; if (d) ({ L, a } = d); else { const [l, aa] = DEFSET[pc]; L = LET.indexOf(l); a = aa; }
  const oct = (w - a - LPC[L]) / 12 - 1;
  return { L, a, oct, name: LET[L] + accS(a) + oct, step: L + 7 * oct, inScale: !!d };
}

// ================= the tune: 32 bars AABA, split bars =================
const A1 = [['Cmaj7'],['Am7'],['Dm7'],['G7'],['Em7','A7'],['Dm7','G7'],['Cmaj7'],['Dm7','G7']];
const A2 = [['Cmaj7'],['Am7'],['Dm7'],['G7'],['Em7','A7'],['Dm7','G7'],['Cmaj7'],['Cmaj7']];
const BR = [['Gm7'],['C7'],['Fmaj7'],['Fmaj7'],['Bm7b5','E7alt'],['Am7'],['D7'],['Dm7','G7alt']];
let chords = JSON.parse(JSON.stringify([...A1, ...A2, ...BR, ...A1]));
const DUR = { w: 16, h: 8, q: 4, e: 2, s: 1 }, DORDER = ['w','h','q','e','s'], BAR = 16;
function slots() { const out = []; let t = 0; chords.forEach((b, bi) => b.forEach((sym, k) => { const len = BAR / b.length; out.push({ i: out.length, bar: bi, sym, start: t, len, end: t + len, barEnd: k === b.length - 1 }); t += len; })); return out; }
let SL = slots();
const formLen = () => SL[SL.length - 1].end;
const slotAt = t => SL.find(s => t >= s.start && t < s.end) || SL[SL.length - 1];
const timeline = mel => { let t = 0; return mel.map((ev, i) => { const r = { ev, i, start: t, end: t + DUR[ev.d] }; t = r.end; return r; }); };
const melEnd = mel => mel.reduce((t, e) => t + DUR[e.d], 0);
function fillRests(a, b) { const out = []; while (a < b) { const se = slotAt(a).end; const d = DORDER.find(k => DUR[k] <= b - a && a + DUR[k] <= se && a % DUR[k] === 0) || 's'; out.push({ d }); a += DUR[d]; } return out; }

// demo melody over the first 20 bars (deterministic "etude" — eighth-note lines, some quarters, a few rests)
function genMelody(bars) {
  const PAT16 = [['q','e','e','q','q'], ['e','e','e','e','h'], ['e','e','q','e','e','q'], ['h','q','q'], ['q','q','e','e','e','e'], ['e','e','e','e','e','e','q']];
  const PAT8 = [['q','q'], ['e','e','q'], ['e','e','e','e']];
  let p = 64, seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const out = [];
  for (const sl of SL.filter(s => s.bar < bars)) {
    const sc = buildSlot(slotDef(sl.sym), [0,0]);
    const pats = sl.len === 16 ? PAT16 : PAT8, pat = pats[Math.floor(rnd() * pats.length)];
    const ups = [];
    for (let m = 48; m < 90; m++) if (sc.pcs.has(mod(m, 12))) ups.push(m);
    let idx = ups.findIndex(m => m >= p); if (idx < 0) idx = ups.length - 1;
    // land on nearest chord tone at slot start
    for (let k = 0; k < 3; k++) { if (sc.chordPcs.has(mod(ups[idx], 12))) break; idx += (ups[idx] > 70 ? -1 : 1); }
    pat.forEach((d, j) => {
      if (j > 0 && rnd() < 0.07) { out.push({ d }); return; }
      out.push({ pitch: ups[idx], d });
      const dir = ups[idx] > 74 ? -1 : ups[idx] < 60 ? 1 : (rnd() < 0.5 ? -1 : 1);
      idx = Math.max(0, Math.min(ups.length - 1, idx + dir * (rnd() < 0.3 ? 2 : 1)));
    });
    p = ups[idx];
  }
  return out;
}

// ================= state =================
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const VARS = { A: 'Scroll stack', B: 'Focus rows', C: 'Fit all + rail' };
let variant = VARS[P.get('variant')] ? P.get('variant') : 'A';
let read = P.get('read') === '1', readMode = 'fit';
let frame = P.get('frame') || 'fluid', split = +(P.get('split') || 50);
let instrIdx = 0, muted = false, bpr = 4, zoomA = 1, title = 'Etude in C (AABA, 32 bars)';
let melody = genMelody(20);
let caretT = melEnd(melody), latch = 'e', restOn = false;
const undoS = [], redoS = [];
const snap = () => JSON.stringify({ melody, chords, caretT });
function commit(fn) { const before = snap(); if (fn() === false) return; undoS.push(before); redoS.length = 0; renderAll(); }
function restore(s) { const o = JSON.parse(s); melody = o.melody; chords = o.chords; caretT = o.caretT; SL = slots(); }
function undo() { if (!undoS.length) return; redoS.push(snap()); restore(undoS.pop()); renderAll(); }
function redo() { if (!redoS.length) return; undoS.push(snap()); restore(redoS.pop()); renderAll(); }
const iv = () => INSTR[instrIdx][3];
const activeSlot = () => caretT >= formLen() ? SL[SL.length - 1] : slotAt(caretT);
const scCache = new Map();
const scOf = s => { const k = s.sym + '|' + instrIdx; if (!scCache.has(k)) scCache.set(k, buildSlot(slotDef(s.sym), iv())); return scCache.get(k); };
function toast(msg) { const t = $('toast'); if (!t) return; t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800); }
function blink(id) { const b = $(id); if (!b) return; b.classList.remove('blink'); void b.offsetWidth; b.classList.add('blink'); }

// ================= editing (overwrite model) =================
const LNAME = { w: 'whole', h: 'half', q: 'quarter', e: '8th', s: '16th' };
function insert(ev) {
  const T = caretT;
  if (T >= formLen()) { toast('Caret is at the end of the form'); return; }
  if (T + DUR[ev.d] > slotAt(T).end) { toast(`A ${LNAME[ev.d]} doesn't fit before the slot ends`); blink('len_' + ev.d); return; }
  const D = DUR[ev.d];
  commit(() => {
    const tl = timeline(melody), end = melEnd(melody), out = [];
    tl.filter(r => r.end <= T).forEach(r => out.push(r.ev));
    if (T > end) out.push(...fillRests(end, T));
    out.push(ev);
    const over = tl.filter(r => r.end > T && r.start < T + D), last = over[over.length - 1];
    if (last && last.end > T + D) out.push(...fillRests(T + D, last.end));
    tl.filter(r => r.start >= T + D && !over.includes(r)).forEach(r => out.push(r.ev));
    melody = out; caretT = T + D;
  });
}
function del(back) {
  commit(() => {
    const tl = timeline(melody), T = caretT, r = back ? tl.find(x => x.end === T) : tl.find(x => x.start === T);
    if (!r) { if (back) { caretT = Math.max(0, T - DUR[latch]); return; } return false; }
    if (r.ev.pitch != null) melody[r.i] = { d: r.ev.d }; else if (r.i === melody.length - 1) melody.pop();
    if (back) caretT = r.start;
  });
}
function moveCaret(dir) {
  const tl = timeline(melody), end = melEnd(melody), T = caretT;
  if (dir > 0) { const r = tl.find(x => x.start === T); caretT = Math.min(formLen(), r ? r.end : T + DUR[latch]); }
  else { const r = tl.find(x => x.end === T); caretT = r ? r.start : Math.max(end > T ? 0 : end, T - DUR[latch]); }
  renderAll();
}
function nudge(dir, octave) {
  const r = timeline(melody).find(x => x.end === caretT);
  if (!r || r.ev.pitch == null) { toast('No note just before the caret'); return; }
  const sc = scOf(slotAt(r.start)), I = iv()[1]; let w = r.ev.pitch + I;
  if (octave) w += 12 * dir; else { do { w += dir; } while (!sc.pcs.has(mod(w, 12))); }
  commit(() => { melody[r.i] = { ...r.ev, pitch: w - I }; }); play(w - I);
}
function placeCaretAt(slot, frac) {
  const t = slot.start + frac * slot.len, tl = timeline(melody), end = melEnd(melody);
  const r = tl.find(x => t >= x.start && t < x.end);
  caretT = r ? r.start : Math.max(end, Math.floor(t / DUR[latch]) * DUR[latch]);
  if (!r && caretT > end && slotAt(caretT) !== slot) caretT = Math.max(end, slot.start);
  renderAll();
}
function caretToEvent(i) { caretT = timeline(melody)[i].start; const ev = melody[i]; if (ev.pitch != null) play(ev.pitch); renderAll(); }
function setLatch(d) { latch = d; if (restOn) { insert({ d }); return; } renderAll(); }
function restKey() { restOn = !restOn; renderAll(); }

// ================= notation stand-in (scaled by z) =================
const G = 7, TOPY = 26, SVGH = 100;
function renderSlotSvg(sl, Wpx, z, interactive) {
  const W = Wpx / z, sc = scOf(sl), lo = INSTR[instrIdx][1];
  const bass = lo && parsePitch(lo) < 52, base = bass ? 18 : 30, botY = TOPY + 4 * G;
  const y = st => botY - (st - base) * G / 2;
  const padL = 10, padR = 6, inner = W - padL - padR, xT = t => padL + (t - sl.start) / sl.len * inner;
  let h = `<g transform="scale(${z})">`;
  for (let k = 0; k < 5; k++) h += `<line x1="0" x2="${W}" y1="${TOPY + k * G}" y2="${TOPY + k * G}" stroke="#999" stroke-width="${1 / z}"/>`;
  const rowStart = sl.i === 0 || (SL[sl.i - 1].bar !== sl.bar && sl.bar % bpr === 0);
  if (rowStart) h += `<text x="1" y="${botY - 2}" font-size="30" fill="#555">${bass ? '𝄢' : '𝄞'}</text>`;
  const tl = timeline(melody), T = caretT, act = interactive && activeSlot() === sl;
  const range = lo ? [parsePitch(lo), parsePitch(INSTR[instrIdx][2])] : null;
  for (const r of tl) {
    if (r.start < sl.start || r.start >= sl.end) continue;
    const x0 = xT(r.start), x1 = xT(r.end), hx = x0 + 9;
    h += `<g class="ev" data-i="${r.i}">`;
    h += `<rect x="${x0}" y="0" width="${Math.max(4, x1 - x0)}" height="${SVGH}" fill="${interactive && r.start === T ? '#2a6fdb22' : 'transparent'}"/>`;
    if (r.ev.pitch == null) {
      const L1 = TOPY + G, L2 = TOPY + 2 * G, d = r.ev.d;
      if (d === 'w') h += `<rect x="${hx - 6}" y="${L1}" width="12" height="4" fill="#333"/>`;
      else if (d === 'h') h += `<rect x="${hx - 6}" y="${L2 - 4}" width="12" height="4" fill="#333"/>`;
