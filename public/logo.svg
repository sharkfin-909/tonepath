<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 0 120 120" role="img" aria-label="Tonepath">
  <title>Tonepath</title>
  <style>
    .ink { fill: #1d1b19; }
    .line { stroke: #1d1b19; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f3eee6; }
      .line { stroke: #f3eee6; }
    }
  </style>
  <!-- Flat-top hexagon (centre 46,76, radius 34) -->
  <polygon class="line" fill="none" stroke-width="6.5" stroke-linejoin="round"
           points="80,76 63,105.4 29,105.4 12,76 29,46.6 63,46.6"/>
  <!-- Note: head inside, stem rises through the top edge, flag sits wholly outside -->
  <g class="ink" transform="rotate(28 46 76)">
    <circle cx="46" cy="76" r="12"/>
    <rect x="53.5" y="-1" width="4.5" height="74" rx="1"/>
    <path d="M58 -1 C61.5 11 87.5 14 99.5 26 C108.5 35 109.5 45 104.5 53 C103.5 44 98.5 36 89.5 31 C80.5 26 67.5 24 58 23 Z"/>
  </g>
</svg>
